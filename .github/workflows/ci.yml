name: CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      - run: npm run build

      - name: Run unit tests
        run: |
          npm test 2>&1 | tee test.log || {
            echo "### Unit Test Failure on Node ${{ matrix.node }}" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            cat test.log >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            exit 1
          }

      - name: Prove the self-healing loop (offline)
        run: npm run demo:offline

      - name: Restore the seeded demo bug
        run: npm run demo:reset

      - name: Run the multi-language repair benchmark
        run: npm run bench
