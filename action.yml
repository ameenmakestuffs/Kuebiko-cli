name: Kuebiko Verified Repair
description: Run a command, repair failures through a safety-first AI ladder, and verify the patch before keeping it.
author: Ameen Ansari
branding:
  icon: shield
  color: purple

inputs:
  command:
    description: Command to run and repair, for example "npm test".
    required: false
    default: "npm test"
  cwd:
    description: Project directory, relative to the GitHub workspace.
    required: false
    default: "."
  engine:
    description: Repair engine: auto, ai, gemini, or local.
    required: false
    default: "auto"
  provider:
    description: AI provider: gemini, openai, anthropic, azure, bedrock, ollama, or auto.
    required: false
    default: "auto"
  model:
    description: Optional model override for the selected provider.
    required: false
    default: ""
  timeout:
    description: Timeout in seconds for each command run.
    required: false
    default: "300"
  max-iterations:
    description: Maximum repair attempts.
    required: false
    default: "3"
  offline:
    description: Set to true to skip AI and use only the local engine.
    required: false
    default: "false"
  node-version:
    description: Node.js version used to run Kuebiko.
    required: false
    default: "20"

outputs:
  report-path:
    description: Path to the generated Kuebiko session report.
    value: ${{ steps.repair.outputs.report-path }}

runs:
  using: composite
  steps:
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs['node-version'] }}

    - name: Install Kuebiko
      shell: bash
      working-directory: ${{ github.action_path }}
      run: npm ci --no-audit --no-fund

    - name: Build Kuebiko
      shell: bash
      working-directory: ${{ github.action_path }}
      run: npm run build

    - name: Run verified repair
      id: repair
      shell: bash
      env:
        NO_SPINNER: "1"
        KUEBIKO_ACTION_PATH: ${{ github.action_path }}
        KUEBIKO_COMMAND: ${{ inputs.command }}
        KUEBIKO_CWD: ${{ inputs.cwd }}
        KUEBIKO_ENGINE: ${{ inputs.engine }}
        KUEBIKO_PROVIDER: ${{ inputs.provider }}
        KUEBIKO_MODEL: ${{ inputs.model }}
        KUEBIKO_TIMEOUT: ${{ inputs.timeout }}
        KUEBIKO_MAX_ITERATIONS: ${{ inputs['max-iterations'] }}
        KUEBIKO_OFFLINE: ${{ inputs.offline }}
      run: |
        set -euo pipefail
        cwd="$KUEBIKO_CWD"
        if [ "$cwd" = "." ]; then
          cwd="$GITHUB_WORKSPACE"
        elif [[ "$cwd" != /* ]]; then
          cwd="$GITHUB_WORKSPACE/$cwd"
        fi

        args=("run" "$KUEBIKO_COMMAND" "--cwd" "$cwd" "--engine" "$KUEBIKO_ENGINE" "--timeout" "$KUEBIKO_TIMEOUT" "--max-iterations" "$KUEBIKO_MAX_ITERATIONS")
        if [ -n "$KUEBIKO_PROVIDER" ] && [ "$KUEBIKO_PROVIDER" != "auto" ]; then
          args+=("--provider" "$KUEBIKO_PROVIDER")
        fi
        if [ -n "$KUEBIKO_MODEL" ]; then
          args+=("--model" "$KUEBIKO_MODEL")
        fi
        if [ "$KUEBIKO_OFFLINE" = "true" ]; then
          args+=("--offline")
        fi

        status=0
        node "$KUEBIKO_ACTION_PATH/dist/cli/index.js" "${args[@]}" || status=$?
        if [ -f "$cwd/.kuebiko/reports/latest.json" ]; then
          echo "report-path=$cwd/.kuebiko/reports/latest.json" >> "$GITHUB_OUTPUT"
        else
          echo "report-path=$cwd/.aegis/reports/latest.json" >> "$GITHUB_OUTPUT"
        fi
        exit $status
